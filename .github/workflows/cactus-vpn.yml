name: CACTUS VPN Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: cactus-vpn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MAIN_FILE: "BOT.py"
  PACKAGE_NAME: "CACTUS-VPN-FINAL.zip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:

  validate:

    name: Validate CACTUS VPN

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ==========================================================
      # 3. SHOW FILES
      # ==========================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CACTUS VPN REPOSITORY"
          echo "========================================"

          pwd

          echo ""
          echo "Files:"
          find . \
            -maxdepth 4 \
            -type f \
            -not -path "./.git/*" \
            | sort

      # ==========================================================
      # 4. CHECK BOT.PY
      # ==========================================================

      - name: Check BOT.py
        shell: bash
        run: |
          set -e

          if [ ! -f "${MAIN_FILE}" ]; then
            echo "ERROR: BOT.py was not found."
            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 3 \
              -type f \
              -not -path "./.git/*" \
              | sort

            exit 1
          fi

          echo "BOT.py found."

      # ==========================================================
      # 5. INSTALL DEPENDENCIES ONLY IF THEY EXIST
      # ==========================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found."
            pip install -r requirements.txt

          elif [ -f "pyproject.toml" ]; then
            echo "pyproject.toml found."
            pip install .

          else
            echo "No requirements.txt or pyproject.toml found."
            echo "Skipping dependency installation."
          fi

      # ==========================================================
      # 6. COMPILE
      # ==========================================================

      - name: Compile BOT.py
        shell: bash
        run: |
          set -e

          python -m py_compile "${MAIN_FILE}"

          echo ""
          echo "========================================"
          echo "PYTHON COMPILE: SUCCESS"
          echo "========================================"

      # ==========================================================
      # 7. AST VALIDATION
      # ==========================================================

      - name: Validate Python AST
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("BOT.py")

          source = path.read_text(
              encoding="utf-8"
          )

          ast.parse(
              source,
              filename=str(path)
          )

          print("AST validation successful.")
          PY

      # ==========================================================
      # 8. CHECK REQUIRED FUNCTIONS
      # ==========================================================

      - name: Check required functions
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("BOT.py")

          source = path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(
              source,
              filename=str(path)
          )

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(
                  node,
                  (
                      ast.FunctionDef,
                      ast.AsyncFunctionDef
                  )
              )
          }

          required = {
              "create_youpanel_service"
          }

          missing = required - functions

          if missing:
              print("Missing functions:")

              for item in sorted(missing):
                  print(
                      " -",
                      item
                  )

              raise SystemExit(1)

          print(
              "Required functions verified."
          )
          PY

      # ==========================================================
      # 9. CHECK DURATION SYSTEM
      # ==========================================================

      - name: Check duration system
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "_parse_plan_duration",
              "_add_months",
              "_target_expiry"
          ]

          missing = []

          for item in required:
              if item not in source:
                  missing.append(item)

          if missing:
              print(
                  "Missing duration helpers:"
              )

              for item in missing:
                  print(
                      " -",
                      item
                  )

              raise SystemExit(1)

          print(
              "Duration system verified."
          )
          PY

      # ==========================================================
      # 10. CHECK DIAGNOSTIC SYSTEM
      # ==========================================================

      - name: Check diagnostic system
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "_safe_panel_url",
              "_redact_password_inputs",
              "_save_youpanel_failure",
              "youpanel_error.txt",
              "youpanel_error.html",
              "youpanel_error.png"
          ]

          missing = []

          for item in required:
              if item not in source:
                  missing.append(item)

          if missing:
              print(
                  "Missing diagnostic components:"
              )

              for item in missing:
                  print(
                      " -",
                      item
                  )

              raise SystemExit(1)

          print(
              "Diagnostic system verified."
          )
          PY

      # ==========================================================
      # 11. CHECK SELENIUM
      # ==========================================================

      - name: Check Selenium automation
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          markers = [
              "selenium",
              "webdriver",
              "WebDriverWait"
          ]

          found = False

          for marker in markers:
              if marker in source:
                  found = True
                  break

          if not found:
              raise SystemExit(
                  "Selenium automation was not detected."
              )

          print(
              "Selenium automation detected."
          )
          PY

      # ==========================================================
      # 12. CHECK CONFIGURATION
      # ==========================================================

      - name: Check bot configuration
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "BOT_TOKEN",
              "OWNER_ID",
              "SUPPORT_USERNAME"
          ]

          for item in required:

              if item not in source:

                  raise SystemExit(
                      f"Missing configuration: {item}"
                  )

          print(
              "Bot configuration structure verified."
          )
          PY

      # ==========================================================
      # 13. CHECK SECRET HANDLING
      # ==========================================================

      - name: Check environment token usage
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          if "os.getenv" not in source:
              print(
                  "WARNING: os.getenv was not detected."
              )
          else:
              print(
                  "Environment variable handling detected."
              )
          PY

      # ==========================================================
      # 14. CHECK PAYMENT ID
      # ==========================================================

      - name: Check payment correlation
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          if "payment_id" not in source:
              raise SystemExit(
                  "payment_id handling was not detected."
              )

          print(
              "Payment correlation detected."
          )
          PY

      # ==========================================================
      # 15. CHECK ERROR REPORTING
      # ==========================================================

      - name: Check traceback handling
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          source = Path(
              "BOT.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "traceback.format_exc",
              "type(exc).__name__",
              "str(exc)"
          ]

          for item in required:

              if item not in source:

                  raise SystemExit(
                      "Missing error-reporting component: "
                      + item
                  )

          print(
              "Traceback/error reporting verified."
          )
          PY

      # ==========================================================
      # 16. OPTIONAL TESTS
      # ==========================================================

      - name: Run tests when available
        shell: bash
        run: |
          set -e

          if [ -d "tests" ]; then

            echo "Tests directory found."

            python -m pytest -q

          else

            echo "No tests directory."

            echo "Skipping pytest."

          fi

      # ==========================================================
      # 17. CLEAN BUILD DIRECTORY
      # ==========================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf build

          rm -f "${PACKAGE_NAME}"

          mkdir -p \
            "build/CACTUS-VPN"

      # ==========================================================
      # 18. COPY BOT
      # ==========================================================

      - name: Copy BOT.py
        shell: bash
        run: |
          set -e

          cp \
            BOT.py \
            build/CACTUS-VPN/BOT.py

      # ==========================================================
      # 19. COPY OPTIONAL REQUIREMENTS
      # ==========================================================

      - name: Copy requirements when available
        shell: bash
        run: |
          set -e

          if [ -f "requirements.txt" ]; then

            cp \
              requirements.txt \
              build/CACTUS-VPN/requirements.txt

          fi

      # ==========================================================
      # 20. COPY README WHEN AVAILABLE
      # ==========================================================

      - name: Copy README when available
        shell: bash
        run: |
          set -e

          if [ -f "README.md" ]; then

            cp \
              README.md \
              build/CACTUS-VPN/README.md

          fi

      # ==========================================================
      # 21. REMOVE BYTECODE
      # ==========================================================

      - name: Remove Python bytecode
        shell: bash
        run: |
          set -e

          find build \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find build \
            -type f \
            -name "*.pyc" \
            -delete

      # ==========================================================
      # 22. REMOVE TEMPORARY FILES
      # ==========================================================

      - name: Remove temporary files
        shell: bash
        run: |
          set -e

          find build \
            -type f \
            -name "*.log" \
            -delete

          find build \
            -type f \
            -name "*.tmp" \
            -delete

          find build \
            -type f \
            -name "*.bak" \
            -delete

      # ==========================================================
      # 23. COMPILE PACKAGED BOT
      # ==========================================================

      - name: Validate packaged BOT.py
        shell: bash
        run: |
          set -e

          python \
            -m py_compile \
            build/CACTUS-VPN/BOT.py

      # ==========================================================
      # 24. CREATE ZIP
      # ==========================================================

      - name: Create final ZIP
        shell: bash
        run: |
          set -e

          cd build

          zip \
            -r \
            "../${PACKAGE_NAME}" \
            CACTUS-VPN

          cd ..

      # ==========================================================
      # 25. VERIFY ZIP
      # ==========================================================

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -e

          test \
            -f \
            "${PACKAGE_NAME}"

          unzip \
            -t \
            "${PACKAGE_NAME}"

      # ==========================================================
      # 26. SHOW ZIP
      # ==========================================================

      - name: Show final ZIP contents
        shell: bash
        run: |
          set -e

          unzip \
            -l \
            "${PACKAGE_NAME}"

      # ==========================================================
      # 27. FINAL CHECK
      # ==========================================================

      - name: Final validation
        shell: bash
        run: |
          set -e

          test \
            -f \
            "${PACKAGE_NAME}"

          test \
            -f \
            "build/CACTUS-VPN/BOT.py"

          python \
            -m py_compile \
            "build/CACTUS-VPN/BOT.py"

          echo ""
          echo "=========================================="
          echo "CACTUS VPN VALIDATION SUCCESSFUL"
          echo "=========================================="

      # ==========================================================
      # 28. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload CACTUS VPN ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CACTUS-VPN-FINAL
          path: CACTUS-VPN-FINAL.zip
          if-no-files-found: error

      # ==========================================================
      # 29. SUMMARY
      # ==========================================================

      - name: Create workflow summary
        shell: bash
        run: |
          {
            echo "# CACTUS VPN"
            echo ""
            echo "## Validation"
            echo ""
            echo "- Python syntax: PASS"
            echo "- AST validation: PASS"
            echo "- Required functions: PASS"
            echo "- Diagnostic system: PASS"
            echo "- Selenium detection: PASS"
            echo "- Package creation: PASS"
            echo "- ZIP integrity: PASS"
            echo ""
            echo "## Artifact"
            echo ""
            echo "\`${PACKAGE_NAME}\`"
            echo ""
            echo "Live YouPanel automation is not claimed unless a real panel test was executed."
          } >> "$GITHUB_STEP_SUMMARY"
