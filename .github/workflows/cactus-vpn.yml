duration_parser:
  accepted_digits:
    persian: "۰۱۲۳۴۵۶۷۸۹"
    arabic: "٠١٢٣٤٥٦٧٨٩"
    ascii: "0123456789"
  accepted_units:
    days:
      - "روز"
      - "روزه"
      - "day"
      - "days"
      - "d"
    months:
      - "ماه"
      - "ماهه"
      - "month"
      - "months"
      - "mo"
    years:
      - "سال"
      - "ساله"
      - "year"
      - "years"
      - "yr"
      - "yrs"
      - "y"
  default_unit: "days"
  invalid:
    - "empty"
    - "zero"
    - "negative"
    - "unknown_unit"
    - "non_numeric"

expiry:
  calculation:
    days: "datetime + timedelta(days=amount)"
    months: "calendar_month_addition_with_day_clamping"
    years: "calendar_month_addition(amount * 12)"
  preserve_time: true
  record_target_datetime: true

youpanel:
  automation:
    login:
      wait_for_page: true
      verify_success: true
    users:
      verify_navigation: true
    add_user:
      verify_form: true
    username:
      generate_if_missing: true
      verify_field: true
    volume:
      use_panel_unit: true
      verify_after_entry: true
    expiry:
      use_real_date_picker: true
      use_real_time_picker: true
      no_unverified_send_keys: true
      no_hidden_field_hacks: true
      verify_selected_values: true
    groups:
      verify_before_submit: true
    submit:
      explicit_wait: true
      verify_success: true
    subscription:
      verify_user: true
      verify_nonempty: true

diagnostics:
  files:
    text: "youpanel_error.txt"
    html: "youpanel_error.html"
    screenshot: "youpanel_error.png"
  include:
    - "payment_id"
    - "step"
    - "exception_class"
    - "exception_message"
    - "current_url_without_query"
    - "page_title"
    - "duration"
    - "target_datetime"
    - "full_traceback"
  redact:
    - "password input values"
    - "query strings containing secrets"
    - "environment variable secrets"
    - "bot tokens"
  never_redact:
    - "exception class"
    - "step name"
    - "non-secret URL path"
    - "page title"
    - "target datetime"

logging:
  levels:
    development: "DEBUG"
    production: "INFO"
  include_context:
    - "payment_id"
    - "step"
    - "plan"
    - "duration"
  avoid:
    - "bot token"
    - "panel password"
    - "user password"
    - "session cookies"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

failure_policy:
  browser_failure:
    save_diagnostics: true
    mark_payment_as_failed_or_error: true
    never_report_success: true
  parser_failure:
    save_context: true
    stop_before_browser: true
  validation_failure:
    stop_before_submit: true
  unknown_failure:
    preserve_traceback: true
    re_raise: true

verification:
  syntax:
    command: "python -m py_compile BOT.py"
    required_exit_code: 0
  runtime:
    requires_real_panel: true
    requires_real_credentials: true
    requires_real_browser: true
    claim_only_if_executed: true
  browser:
    verify_each_major_step: true
    verify_final_service: true

final_output:
  required:
    - "updated BOT.py"
    - "clean ZIP archive"
    - "syntax validation result"
    - "file listing"
  forbidden_claims:
    - "100% working"
    - "fully tested"
    - "panel verified"
    - "payment verified"
  unless:
    - "the corresponding real-world test was actually executed"

completion:
  status_values:
    - "success"
    - "failed"
    - "blocked"
    - "syntax_valid_runtime_unverified"
  success_requires:
    - "requested code changes completed"
    - "syntax validation passed"
    - "package created"
    - "no known unresolved static errors"
  runtime_unverified_message: "Syntax/package validation completed; live YouPanel runtime was not executed."

