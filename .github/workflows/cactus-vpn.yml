# ============================================================
# CACTUS VPN — ENGINEERING / AUTOMATION TASK SPECIFICATION
# Version: 1.0
# Format: YAML
# Purpose: deterministic implementation and verification workflow
# ============================================================

project:
  name: "CACTUS VPN"
  language: "Python"
  primary_file: "BOT.py"
  packaging:
    output: "CACTUS-VPN-FINAL.zip"
    preserve_existing_structure: true
  execution_policy:
    inspect_before_edit: true
    preserve_existing_features: true
    no_unrequested_rewrites: true
    no_placeholder_implementations: true
    no_fake_success: true

objective:
  summary: "Implement, verify, diagnose, and package the CACTUS VPN Telegram bot."
  priorities:
    - "Correctness"
    - "Deterministic browser automation"
    - "Reliable error reporting"
    - "Preservation of existing functionality"
    - "Syntax validity"
    - "Safe failure behavior"
    - "Clear logging"
    - "Reproducible packaging"

rules:
  inspect_source_first: true
  inspect_all_relevant_files: true
  search_before_replacing: true
  never_guess_selectors: true
  never_delete_working_features_without_reason: true
  never_hide_exceptions: true
  never_replace_real_logic_with_demo_logic: true
  never_claim_live_panel_testing_without_live_testing: true
  never_embed_secrets_in_source: true
  use_environment_variables_for_secrets: true
  preserve_existing_credentials_format: true
  preserve_existing_database_or_json_schema: true
  preserve_existing_telegram_handlers: true
  preserve_existing_admin_permissions: true
  preserve_existing_payment_flow: true
  preserve_existing_plan_data: true
  preserve_existing_subscription_flow: true
  use_explicit_waits_for_selenium: true
  minimize_fixed_sleep: true
  save_diagnostic_artifacts_on_failure: true

tasks:

  - id: "TASK-0001"
    title: 'Inspect archive structure'
    severity: high
    action: 'Extract the supplied project into a clean working directory and enumerate every file.'
    verify: 'Archive extraction succeeds and the complete file list is recorded.'
    on_failure: "stop_current_phase_and_record_full_diagnostics"

  - id: "TASK-0002"
    title: 'Locate primary bot'
