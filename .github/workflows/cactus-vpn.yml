name: CACTUS VPN

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SECOND_BOT_TOKEN: ${{ secrets.SECOND_BOT_TOKEN }}
      SECOND_CHAT_ID: ${{ secrets.SECOND_CHAT_ID }}
      DB_NAME: ${{ github.workspace }}/cactus_vpn.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile BOT.py

      - name: Verify required secret
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing."
            exit 1
          fi

      - name: Start bot
        run: python BOT.py
