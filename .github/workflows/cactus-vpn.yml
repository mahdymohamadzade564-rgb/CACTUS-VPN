name: CACTUS VPN Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cactus-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validate BOT.py exists
        shell: bash
        run: |
          test -f BOT.py
          echo "BOT.py found."

      - name: Compile BOT.py
        shell: bash
        run: |
          python -m py_compile BOT.py
          echo "Python compilation successful."

      - name: Parse BOT.py AST
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("BOT.py")
          source = path.read_text(encoding="utf-8")
          ast.parse(source, filename=str(path))

          print("AST validation successful.")
          PY

      - name: Verify required functions
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("BOT.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))

          required = {
              "create_youpanel_service",
          }

          found = {
              node.name
              for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          missing = required - found

          if missing:
              raise SystemExit(
                  "Missing required functions: "
                  + ", ".join(sorted(missing))
              )

          print("Required functions verified.")
          PY

      - name: Verify configuration variables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("BOT.py").read_text(encoding="utf-8")

          required = [
              "BOT_TOKEN",
              "OWNER_ID",
              "SUPPORT_USERNAME",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(f"Missing configuration variable: {item}")

          print("Configuration structure verified.")
          PY

      - name: Verify duration parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("BOT.py").read_text(encoding="utf-8")

          required = [
              "_parse_plan_duration",
              "_add_months",
              "_target_expiry",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(f"Missing duration helper: {item}")

          print("Duration helpers verified.")
          PY

      - name: Verify diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("BOT.py").read_text(encoding="utf-8")

          required = [
              "_safe_panel_url",
              "_redact_password_inputs",
              "_save_youpanel_failure",
              "youpanel_error.txt",
              "youpanel_error.html",
              "youpanel_error.png",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(f"Missing diagnostic component: {item}")

          print("Diagnostic system verified.")
          PY

      - name: Verify Selenium automation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("BOT.py").read_text(encoding="utf-8")

          selenium_markers = [
              "webdriver",
              "WebDriverWait",
              "selenium",
          ]

          found = any(
              marker in source
              for marker in selenium_markers
          )

          if not found:
              raise SystemExit(
                  "Selenium automation code was not detected."
              )

          print("Selenium automation detected.")
          PY

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found."
            echo "Static validation will be used."
          fi

      - name: Prepare package
        shell: bash
        run: |
          rm -rf build
          rm -f cactus-vpn.zip
          mkdir -p build/CACTUS-VPN

          cp BOT.py build/CACTUS-VPN/

          if [ -f requirements.txt ]; then
            cp requirements.txt build/CACTUS-VPN/
          fi

          if [ -f README.md ]; then
            cp README.md build/CACTUS-VPN/
          fi

      - name: Remove temporary files
        shell: bash
        run: |
          find build -type d -name "__pycache__" -prune -exec rm -rf {} +
          find build -type f -name "*.pyc" -delete
          find build -type f -name "*.log" -delete

      - name: Validate packaged BOT.py
        shell: bash
        run: |
          python -m py_compile build/CACTUS-VPN/BOT.py

      - name: Create ZIP
        shell: bash
        run: |
          cd build
          zip -r ../cactus-vpn.zip CACTUS-VPN
          cd ..

      - name: Verify ZIP
        shell: bash
        run: |
          test -f cactus-vpn.zip
          unzip -t cactus-vpn.zip

      - name: Display package contents
        shell: bash
        run: |
          unzip -l cactus-vpn.zip

      - name: Final validation
        shell: bash
        run: |
          test -f cactus-vpn.zip
          test -f build/CACTUS-VPN/BOT.py
          python -m py_compile build/CACTUS-VPN/BOT.py
          echo "CACTUS VPN workflow validation completed."

      - name: Upload CACTUS VPN package
        uses: actions/upload-artifact@v4
        with:
          name: CACTUS-VPN
          path: cactus-vpn.zip
          if-no-files-found: error

